[project]
name = "kardashev-collector"
version = "0.1.0"
description = "Upload-policy service for Kardashev playtest telemetry"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "google-cloud-storage>=3.0.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kardashev_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
