[project]
name = "kardashev-telemetry"
version = "0.1.0"
description = "Analysis of Kardashev playtest telemetry sessions"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
kardashev-analysis = "kardashev_analysis.cli:main"
tel = "kardashev_analysis.tel:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis/src/kardashev_analysis"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
pythonpath = ["analysis/src"]
