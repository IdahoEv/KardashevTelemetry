[project]
name = "kardashev-telemetry"
version = "0.1.0"
description = "Analysis of Kardashev playtest telemetry sessions"
requires-python = ">=3.12"
dependencies = ["duckdb"]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analysis/src/kardashev_analysis"]

[tool.pytest.ini_options]
testpaths = ["analysis/tests"]
pythonpath = ["analysis/src"]
